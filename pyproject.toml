[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "nevertwice"
version = "2.4.0"
description = "Proactive, local-first memory for AI coding agents - it acts before your agent repeats a mistake. Formerly Anamnesis."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Platon Chernov" }]
keywords = ["memory", "llm", "agents", "mcp", "claude", "rag", "embeddings", "zettelkasten"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = []   # standard library only; Ollama/cloud are reached over HTTP

# Everything below is OPTIONAL - the core stays stdlib-only. Install only what you use.
[project.optional-dependencies]
reranker = ["torch", "transformers"]   # trained cross-encoder precision boost (NEVERTWICE_XRERANK=1)
langchain = ["langchain-core"]         # NevertwiceRetriever / NevertwiceMemory adapters
llamaindex = ["llama-index-core"]      # NevertwiceRetriever for LlamaIndex
dev = ["pytest>=8", "pyflakes>=3", "build>=1", "hypothesis>=6"]
# The research tier's own dependencies, declared because they were not: suites under
# `tests/research/` import a lab module at module level and cannot run without these.
# Measured 2026-09-22 by running every research suite with each candidate blocked - these
# names are exactly the set that fails at import, and no other research suite needs
# one. They are NOT in `dev`: the documented contributor path stays small, and the core
# matrix installs nothing at all, which is what makes "the core tier is stdlib-only" a
# fact about the tree rather than a sentence in the workflow.
research = ["networkx>=3", "numpy>=1.26", "scipy>=1.11", "statsmodels>=0.14",
            # Not an import: `complexity.py` shells out to `python -m ruff` for the
            # second opinion its axes are checked against. An import sweep cannot see a
            # dependency invoked as a subprocess, which is why this one was found by CI
            # skipping five checks rather than by any sweep of the source.
            # Pinned BELOW 0.16: the concise line this parser reads is
            # `path:L:C: error[RULE] msg (V > N)` in 0.15, and the research job installed
            # 0.16.8, where it differs - four axes came back empty and were read as
            # numbers. The parser now refuses an unreadable format instead of returning
            # zero, so the pin is about keeping the control RUNNING, not about hiding a
            # break: widen it by teaching the parser the new line and measuring, not by
            # raising the bound.
            "ruff>=0.15,<0.16",
            # R-v2-ports (2026-09-24): `research/_ollama_pacer.py` patches `httpx.Client.send`
            # / `httpx.AsyncClient.send` so a competitor's own client (ollama-python,
            # langchain-ollama - both built on httpx) is paced and retried the same way
            # `urllib.request.urlopen` is. `tests/research/_test_ollama_pacer.py`'s T7
            # exercises that path through `httpx.MockTransport`; without this extra it
            # degrades to a printed note rather than a hard failure (the suite's own guard),
            # but CI's research job installs it so T7 actually runs somewhere.
            "httpx>=0.27"]  # local checks, wheel
# hypothesis is used by tests/_test_properties.py when present and never required: the
# core CI matrix installs nothing, so every property there also has a deterministic
# corpus. A suite that only runs for people who installed an extra stops running.

[project.urls]
Homepage = "https://github.com/DonPlaton/nevertwice"
Repository = "https://github.com/DonPlaton/nevertwice"
Issues = "https://github.com/DonPlaton/nevertwice/issues"
Changelog = "https://github.com/DonPlaton/nevertwice/blob/master/CHANGELOG.md"

[project.scripts]
nevertwice-search = "nevertwice.memory_search:main"
nevertwice-remember = "nevertwice.remember:main"
nevertwice-ingest = "nevertwice.ingest:main"
nevertwice-watch = "nevertwice.watch:main"
nevertwice-mcp = "nevertwice.mcp_server:main"
nevertwice-tasks = "nevertwice.manage_tasks:main"
nevertwice-sync = "nevertwice.sync:main"
nevertwice-digest = "nevertwice.digest:main"
nevertwice-conflicts = "nevertwice.digest:conflicts_main"
nevertwice-stats = "nevertwice.stats:main"
nevertwice-import = "nevertwice.import_memory:main"
nevertwice-dashboard = "nevertwice.dashboard:main"
nevertwice-guards = "nevertwice.guards:main"
nevertwice-anticipate = "nevertwice.anticipate:main"
nevertwice-causal = "nevertwice.causal:main"
nevertwice-integrity = "nevertwice.integrity:main"
nevertwice-doctor = "nevertwice.doctor:main"
nevertwice-lens = "nevertwice.lenses:main"
nevertwice-inbox = "nevertwice.inbox:main"
nevertwice-hosts = "nevertwice.hosts:main"
nevertwice-telemetry = "nevertwice.telemetry:main"
nevertwice-migrate = "nevertwice.migrate:main"
nevertwice-store = "nevertwice.store_version:main"
# one release of rename back-compat: the old anamnesis-* commands keep working
anamnesis-search = "nevertwice.memory_search:main"
anamnesis-remember = "nevertwice.remember:main"
anamnesis-mcp = "nevertwice.mcp_server:main"

[tool.setuptools]
packages = ["nevertwice", "nevertwice.integrations", "nevertwice.invariants"]

[tool.setuptools.package-data]
nevertwice = ["*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-p no:cacheprovider"

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" width="960" height="620" role="img" aria-labelledby="ttl dsc" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
<title id="ttl">Nevertwice v3.0 architecture: a write-time lane and a read-time lane, with a dual-tier store, the stages that cost no context tokens, and the one point where memory acts</title>
<desc id="dsc">Two lanes. Write time, left to right: your session in any agent; capture through a hook, an MCP call, the watch daemon or ingest; distil into a dual-tier store, Tier 1 facts that stay resident and Tier 2 episodes retrieved on demand; store as Markdown plus git history that you own, the previous version of every note kept beside the current one. Read time, left to right: the same store; retrieve by z-score fusion of semantic and lexical search behind a temporal anchor; decide against a token budget with a modality gate and a ranker, abstaining rather than guessing; act. Act is the intervention point, where a guard fires, anticipation warns, or a counterfactual is answered. Capture, decide and act cost no context tokens until something fires. Every stage except act stays on your machine by default; act is what reaches the agent. The foot of the diagram names the v3.0 upgrade: dual-tier write time and an attention-native decide stage.</desc>

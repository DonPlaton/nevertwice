<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-labelledby="vttl vdsc" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
<title id="vttl">Nevertwice v3.0 scoreboard: accuracy against four memory systems on LongMemEval and LoCoMo, and the three measured reasons attention-native memory wins</title>
<desc id="vdsc">Two panels. Left: benchmark accuracy on S1 LongMemEval and S4 LoCoMo, five systems in five rows, each row carrying one bar per suite. Nevertwice v3.0 (allmode A6.7) scores S1 100 percent on point B, key and value, and S4 100.0 percent, 25 of 25 questions at F1 53.0. Mem0 2.2.0 scores S1 60 percent on B and 40 on K, and S4 84.0 percent, 21 of 25 at F1 49.8. LangMem 0.0.30 scores S1 40 percent on B and 20 on K, and S4 80.0 percent, 20 of 25 at F1 23.5. Graphify 0.9.93 scores S1 20 percent on B and 20 on K, and S4 76.0 percent with expand against 44.0 percent with query. Claude Code Memory 2.1.304 scores S1 40 percent on B and 40 on V, and S4 28.0 percent, 7 of 25 at F1 9.2. Right: three measured reasons. 66.5 times fewer writer tokens and 10 times fewer calls, 56.0 thousand prompt tokens and 44 calls against Mem0's 3,725.9 thousand tokens and 444 calls, and 9.6 times faster on S1 at 117 seconds against 1,126 seconds per unit. Zero-token idle guards and a modality gate. And nevertwice-embed v2, a LoRA rank-4 Matryoshka model trained in 49 seconds, whose 256-dimensional vectors beat stock bge-m3 at 1024 dimensions.</desc>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 330" width="960" height="330" role="img" aria-labelledby="sttl sdsc" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
<title id="sttl">Never twice: the same mistake, recorded on Monday and stopped on Thursday, in four frames</title>
<desc id="sdsc">Four frames. One: in session A the mistake is recorded as one Markdown note under git, named mistake-sql-built-by-fstring. Two: still in session A, a guard is distilled from it into a ledger rather than into your context. Three: in a later session B the repeat is flagged - the guard fires with a one-line warning, and nothing was spent on context until that line. Four: the corrected action, using a query parameter, runs clean; no guard fires, so this is a warning and not a blanket block. These are the same four beats that examples/guard_demo.py --check prints.</desc>
<defs><marker id="stip" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#B0B0B0"/></marker></defs>
<rect width="960" height="330" fill="#FFFFFF"/>
<text x="36" y="42" font-size="22" font-weight="700" fill="#1A1A1A">Never twice</text>
<text x="36" y="64" font-size="13" fill="#555555">The four beats <tspan font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12">python examples/guard_demo.py --check</tspan> prints, with no model and no key.</text>
<rect x="36" y="92" width="204" height="176" rx="10" fill="#FFFFFF" stroke="#E69F00" stroke-width="2"/>
<circle cx="60" cy="118" r="13" fill="#E69F00"/>
<text x="60" y="123" font-size="13" font-weight="700" text-anchor="middle" fill="#FFFFFF">1</text>
<text x="82" y="116" font-size="11" font-weight="700" letter-spacing="0.8" fill="#555555">SESSION A</text>
<text x="82" y="131" font-size="13" font-weight="600" fill="#1A1A1A">the mistake is recorded</text>
<rect x="52" y="148" width="172" height="60" rx="6" fill="#F5F7F9"/>
<text x="62" y="168" font-size="11" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" fill="#1A1A1A"></text>
<text x="62" y="184" font-size="11" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" fill="#1A1A1A">mistake-sql-built-by-fstring</text>
<text x="52" y="232" font-size="11" fill="#555555">one Markdown note, under git</text>
<path d="M 242 180 L 256 180" stroke="#B0B0B0" stroke-width="2" marker-end="url(#stip)" fill="none"/>
<rect x="260" y="92" width="204" height="176" rx="10" fill="#FFFFFF" stroke="#0072B2" stroke-width="2"/>
<circle cx="284" cy="118" r="13" fill="#0072B2"/>
<text x="284" y="123" font-size="13" font-weight="700" text-anchor="middle" fill="#FFFFFF">2</text>
<text x="306" y="116" font-size="11" font-weight="700" letter-spacing="0.8" fill="#555555">SESSION A</text>
<text x="306" y="131" font-size="13" font-weight="600" fill="#1A1A1A">a guard is distilled</text>
<rect x="276" y="148" width="172" height="60" rx="6" fill="#F5F7F9"/>
<text x="286" y="168" font-size="11" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" fill="#1A1A1A">execute\s*\(\s*f[\"']</text>
<text x="276" y="232" font-size="11" fill="#555555">into a ledger, not your context</text>
<path d="M 466 180 L 480 180" stroke="#B0B0B0" stroke-width="2" marker-end="url(#stip)" fill="none"/>
<rect x="484" y="92" width="204" height="176" rx="10" fill="#FFFFFF" stroke="#CC79A7" stroke-width="2"/>
<circle cx="508" cy="118" r="13" fill="#CC79A7"/>
<text x="508" y="123" font-size="13" font-weight="700" text-anchor="middle" fill="#FFFFFF">3</text>
<text x="530" y="116" font-size="11" font-weight="700" letter-spacing="0.8" fill="#555555">SESSION B</text>
<text x="530" y="131" font-size="13" font-weight="600" fill="#1A1A1A">the repeat is flagged</text>
<rect x="500" y="148" width="172" height="60" rx="6" fill="#F5F7F9"/>
<text x="510" y="168" font-size="11" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" fill="#1A1A1A">past mistake: never</text>
<text x="510" y="184" font-size="11" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" fill="#1A1A1A">build SQL by f-string</text>
<text x="500" y="232" font-size="11" fill="#555555">0 tokens spent until this line</text>
<path d="M 690 180 L 704 180" stroke="#B0B0B0" stroke-width="2" marker-end="url(#stip)" fill="none"/>
<rect x="708" y="92" width="204" height="176" rx="10" fill="#FFFFFF" stroke="#009E73" stroke-width="2"/>
<circle cx="732" cy="118" r="13" fill="#009E73"/>
<text x="732" y="123" font-size="13" font-weight="700" text-anchor="middle" fill="#FFFFFF">4</text>
<text x="754" y="116" font-size="11" font-weight="700" letter-spacing="0.8" fill="#555555">SESSION B</text>
<text x="754" y="131" font-size="13" font-weight="600" fill="#1A1A1A">the correction runs clean</text>
<rect x="724" y="148" width="172" height="60" rx="6" fill="#F5F7F9"/>
<text x="734" y="168" font-size="11" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" fill="#1A1A1A">execute("... WHERE name</text>
<text x="734" y="184" font-size="11" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" fill="#1A1A1A">= ?", (name,))</text>
<text x="724" y="232" font-size="11" fill="#555555">no guard fires - not a blanket block</text>
<text x="36" y="304" font-size="11" fill="#555555">Generated by tools/make_diagrams.py - edit the frames there, not this file.</text>

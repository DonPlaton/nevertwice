# CodeQL configuration for Nevertwice.
#
# The analyzer still runs the full security-and-quality suite; the filters below drop findings
# that describe this repository's shape rather than a defect in it. Each entry names the pattern
# it covers and where that pattern lives, so a reviewer can check the claim instead of trusting
# the comment.
#
# py/empty-except - the hook philosophy is "never crash the host agent": every hook entry
#   point degrades silently rather than breaking a user's coding session. The bare handlers
#   sit on paths where the failure is non-actionable (best-effort telemetry, cosmetic
#   output, cleanup); anything actionable is logged via log(). Flagging all ~90 of them
#   buries real findings in noise.
#
# py/cyclic-import - modules use paired lazy imports (`from . import x` with a plain
#   `import x` fallback) so every file runs both as a package member and as a standalone
#   script (clone-and-run, no pip install). The cycles are import-time-safe by construction
#   and exercised by the test suite on every push.
#
# The script tree (tests/** and research/**) is a few hundred one-shot programs, each of them
# run as `python path/to/_test_x.py`. These idioms are deliberate there:
#
# py/unused-import - every suite starts with `import _env_guard  # noqa: F401`. The import binds
#   no name worth using: importing the module scrubs the NEVERTWICE_* store variables before the
#   engine bakes path constants (incidents 2026-08-13 and 2026-08-18). The side effect IS the
#   purpose, and a static unused-import check cannot see it.
#
# py/import-and-import-from, py/repeated-import - the dual-mode import: `try: from . import x`
#   with `except ImportError: import x`. tests/_test_one_engine.py pins that both shapes load
#   the same body, and the function-local re-imports keep a hook entry point from paying import
#   cost it may never use.
#
# py/unused-global-variable, py/unused-local-variable, py/multiple-definition - the suites and
#   the research scripts bind named intermediates for the reader, rebind a helper while building
#   a case, and unpack tuples only partly (`for label, _value in ...`). In a one-shot script the
#   printed record is the output, so a name kept for it is part of the result.
#
# py/file-not-closed - one-shot scripts hand `open(path, "rb")` straight to a subprocess or read
#   a file and exit; process exit closes the handle. The installed package under nevertwice/ does
#   use context managers, so this filter covers the script tree only.
#
# py/unnecessary-lambda, py/implicit-string-concatenation-in-list,
# py/call/wrong-named-class-argument - script-side style: a zero-argument lambda passed where a
#   callable is wanted, a long message split over adjacent list elements, and keyword arguments
#   to small local classes whose parameter names differ from the caller's spelling. None of the
#   three can change behaviour in a one-shot program, and the suites pin the outputs.
#
# py/catch-base-exception - deliberate breadth. The store-characterisation and dashboard checks
#   catch BaseException to record a traceback as the finding, and the proxy, launcher and budget
#   scripts catch it to release a resource and re-raise. Narrowing the handler would skip the
#   SystemExit / KeyboardInterrupt cleanup paths those releases exist for.
#
# py/mixed-returns - the scripts' dispatch functions return a value on success and fall through
#   to an implicit None on a named refusal; the refusal is what the suite asserts.
#
# A query filter has no path scope, so the twelve rules above also cover nevertwice/ and tools/.
# The trade-off is accepted on purpose: these are dead-code and style rules, and what the
# installed package must do is pinned by the suites. If a dead import in the package ever needs
# its own gate, add a pyflakes step to CI rather than remove a filter the script tree needs.
name: nevertwice-codeql
query-filters:
  - exclude:
      id: py/empty-except
  - exclude:
      id: py/cyclic-import
  - exclude:
      id: py/unused-import
  - exclude:
      id: py/multiple-definition
  - exclude:
      id: py/unused-global-variable
  - exclude:
      id: py/unused-local-variable
  - exclude:
      id: py/import-and-import-from
  - exclude:
      id: py/file-not-closed
  - exclude:
      id: py/unnecessary-lambda
  - exclude:
      id: py/implicit-string-concatenation-in-list
  - exclude:
      id: py/call/wrong-named-class-argument
  - exclude:
      id: py/catch-base-exception
  - exclude:
      id: py/mixed-returns
  - exclude:
      id: py/repeated-import

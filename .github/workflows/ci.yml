name: tests

on:
  push:
    # `invariants/**` is here for a measured reason, not for convenience: the matrix had never
    # run on Linux or macOS, so every cross-OS claim in this repository rested on one machine.
    # The work lands on a long-lived branch before master, and a trigger that only fires on
    # master would first report platform breakage after the merge it was supposed to gate.
    branches: [main, master, 'invariants/**']
  pull_request:

permissions:
  contents: read   # least privilege: the test job only needs to read the repo

jobs:
  # The shipped product (nevertwice/) supports Python 3.10+, so the core suite runs the full
  # matrix across three OSes. Tests are stdlib-only and mock the LLM/embedder - no network, no GPU.
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.12", "3.13", "3.14"]
    steps:
      # fetch-depth: 0, because two suites read the repository's HISTORY rather than its files:
      # `_test_claim_halflife.py` re-derives a published survival curve from the register's 160
      # commits, and `_test_g3_deletion.py` verifies a seal against the digests a file really
      # held. Under the default depth-1 checkout both fail for want of history, not for want of
      # correctness - measured on a real `git clone --depth 1` of this branch: 2 failed, 204
      # passed. This branch has never been pushed, so that would have been the FIRST CI run's
      # result, red on all twelve matrix jobs.
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run core suites
        shell: bash
        # Every suite runs, and the failures are printed as a LIST. `set -e` plus a loop kills
        # the job on the first red file and leaves the rest unrun, so a matrix job reports one
        # defect however many it holds: the first matrix run in 27 days (2026-09-22) died on
        # `_test_cleanup_fixes.py` on Linux and macOS and on `_test_complexity.py` on Windows,
        # and "twelve red jobs" turned out to mean "one defect per job, count unknown". Each
        # fix would then have bought exactly one more layer, at a matrix run apiece.
        run: |
          total=$(ls tests/_test_*.py | wc -l)
          failed=()
          for t in tests/_test_*.py; do
            python "$t" || failed+=("$t")
          done
          if [ ${#failed[@]} -gt 0 ]; then
            echo ""
            echo "${#failed[@]} of $total core suite(s) failed:"
            for t in "${failed[@]}"; do echo "  $t"; done
            exit 1
          fi
          echo ""
          echo "all $total core suites passed"

  # The research/ harnesses are maintainer dev-tools (not in the wheel); they run on current
  # Python only, so they may use newer syntax than the product's 3.10 floor.
  research:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.13"
      - name: Install the research tier's declared dependencies
        # The core matrix deliberately installs nothing; this tier is where the extras live, and
        # until 2026-09-22 they were installed nowhere and the suites needing them sat in the
        # core glob, passing only on a machine that happened to have them.
        run: python -m pip install -e ".[research]"
      - name: Run research suites
        shell: bash
        # Same reason as the core loop above: report every failure, not the first one.
        run: |
          failed=()
          for t in tests/research/_test_*.py; do
            python "$t" || failed+=("$t")
          done
          if [ ${#failed[@]} -gt 0 ]; then
            echo ""
            echo "${#failed[@]} research suite(s) failed:"
            for t in "${failed[@]}"; do echo "  $t"; done
            exit 1
          fi
          echo ""
          echo "all research suites passed"

  # The path a contributor actually follows. The matrix above proves the suites pass when
  # run directly; this proves they pass the way README and CONTRIBUTING tell people to run
  # them - installed from the dev extra, through pytest - and that the release identity
  # (version, tag, distribution metadata) agrees with itself before anything is published.
  packaging:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0   # tags are half of the version contract; a shallow clone has none
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      - name: Install the documented dev environment
        run: python -m pip install -e ".[dev]"
      - name: No script reaches the store without declaring which store
        # Static, and first, because it is the cheapest way to catch the failure class that
        # has hit this repository three times (2026-08-13, 08-18, 08-25): a script under
        # examples/, research/ or tools/ that imports a project module - and therefore
        # resolves config.VAULT - without sandbox_guard.isolate() or .allow_live(reason).
        run: python tools/check_sandbox.py --list
      - name: Run the documented test command
        run: python -m pytest -q
      - name: Version contract - pyproject, runtime, MCP, git tag
        run: python tools/check_version.py
      - name: Build sdist and wheel
        run: python -m build
      - name: Version contract - built distribution metadata
        run: python tools/check_version.py --dist dist
      - name: The threat model names an owner and a test for every claim
        # E2's exit criterion, enforced rather than reviewed: a security document is exactly
        # the kind of file that is written once and then quietly outlives the code. This fails
        # when a claim names a check that does not exist.
        run: python tests/_test_threat_model.py
      - name: No published number was produced by code that has since moved
        # The other half of the manifest contract. render_claims.py proves a document matches
        # the manifest; this proves the manifest matches the engine - for every claim, the last
        # commit to touch any file its command imports must be an ancestor of the commit the
        # claim was measured at. Needs the full history, which is why it lives in this job
        # (fetch-depth: 0) rather than the shallow matrix.
        run: python tools/check_freshness.py
      - name: Published tables match the evidence manifest
        # The suites already run this through tests/_test_evidence_manifest.py; running
        # it as its own step means a stale table is named in the CI summary rather than
        # buried in one suite's output.
        run: python tools/render_claims.py
      - name: The published diagrams match their description
        # Both SVGs are generated from tools/make_diagrams.py, so a diagram cannot drift from
        # what the system does without the file that describes it drifting first.
        run: python tools/make_diagrams.py
      - name: Comparison document matches its committed snapshot
        # Offline: --fetch is the only mode that touches the network, and the snapshot
        # it writes is committed precisely so CI never depends on the GitHub API.
        run: python tools/comparison_snapshot.py
